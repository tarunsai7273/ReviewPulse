<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- Search Content -->
        <div class="search-content">
            <div><p>MyWatchList</p></div>
            <div><p>Home</p></div>
            <div><p>My Reviews</p></div>
            <div><p>Explore</p></div>
            <div><p>Friends</p></div>

            <div class="search-div">
              <input type="text" placeholder="Search movies,animes, series..." class="search-box">
              <img src="searchicon.png" class="search-icon">
            </div>

            <div class="notification">🔔</div>
            <div class="profile-container">
              <img id="profile-pic" src="default-avatar.png" alt="Profile Picture">
            </div>

            <input type="file" id="image-upload" accept="image/*">
        </div>
        

        <div class="discover"></div>

        <div class="random-picks"></div>

        <div class="recently-viewed"></div>
      <script src="script.js"></script>
</body>
